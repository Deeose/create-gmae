<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17263c">
  <meta name="description" content="작은 선택이 쌓여 나만의 삶이 되는 인생 시뮬레이션. 학교에서 시작해 일과 사람, 나만의 이야기를 만나보세요.">
  <title>갈림길 — 인생 육성 시뮬레이션</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23244c40'/%3E%3Cpath d='M32 49V29M32 32L18 18M32 29L46 15' fill='none' stroke='%23f5f2e8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#story">이야기로 바로 가기</a>
  <div id="app"><div class="loading"><span class="loading-mark">↟</span><p>인생을 불러오고 있어요.</p></div></div>
  <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <dialog id="restart-dialog" aria-labelledby="restart-title" aria-describedby="restart-description">
    <div class="dialog-icon" aria-hidden="true">↟</div>
    <h2 id="restart-title">새로운 인생을 시작할까요?</h2>
    <p id="restart-description">이 브라우저에 저장된 현재 이야기가 새 이야기로 바뀝니다. 지금의 선택과 기록은 되돌릴 수 없어요.</p>
    <label class="field-label" for="restart-name">이름 <span>선택 사항</span></label>
    <input id="restart-name" maxlength="20" placeholder="어떤 이름으로 살아볼까요?" autocomplete="off">
    <div class="dialog-actions"><button class="button secondary" id="cancel-restart" type="button">계속 살아가기</button><button class="button primary" id="confirm-restart" type="button">새 인생 시작</button></div>
  </dialog>
  <noscript><p class="noscript">갈림길을 플레이하려면 브라우저의 JavaScript를 켜주세요.</p></noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
